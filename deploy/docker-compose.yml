# yeyu 单机部署（SQLite + uploads 全部放进命名卷 yeyu-data）
#
# 首次部署：
#   cd deploy
#   cp .env.example .env        # 改 JWT_SECRET（必填）与端口
#   docker compose up -d --build
#   docker compose exec server pnpm exec tsx prisma/seed.ts   # 创建首个管理员
#   curl http://127.0.0.1:4000/api/health
#
# 覆盖现实：本仓库开发机没有 docker，本文件只做了 YAML 语法校验，未在真机跑过 compose up。
name: yeyu

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: yeyu-server:0.1.0
    container_name: yeyu
    restart: unless-stopped
    environment:
      # SQLite 绝对路径指向卷内，避免容器重建后数据丢失
      DATABASE_URL: file:/data/app.db
      UPLOAD_DIR: /data/uploads
      PORT: "4000"
      TZ: Asia/Shanghai
      # 必填：不给值 compose 直接报错退出，避免用默认密钥上生产
      JWT_SECRET: ${JWT_SECRET:?请在 deploy/.env 里设置 JWT_SECRET}
      # 首个管理员密码，seed 时读取；留空则用脚本里的默认值
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SKIP_DB_PUSH: ${SKIP_DB_PUSH:-0}
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      - lab-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||4000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  lab-data:
    name: yeyu-data
